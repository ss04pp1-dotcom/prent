name: Build Test APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "Warning: GOOGLE_SERVICES_JSON_BASE64 secret is not set. Build might fail if Firebase requires it."
        else
          echo $GOOGLE_SERVICES_JSON | base64 -d > app-parent/google-services.json
          echo $GOOGLE_SERVICES_JSON | base64 -d > app-child/google-services.json
        fi

    - name: Grant execute permission for gradlew
      
      run: chmod +x gradlew

    - name: Build Debug APKs
      
      run: ./gradlew assembleDebug

    - name: Upload Parent APK
      uses: actions/upload-artifact@v4
      with:
        name: Parent-App-Debug
        path: app-parent/build/outputs/apk/debug/app-parent-debug.apk

    - name: Upload Child APK
      uses: actions/upload-artifact@v4
      with:
        name: Child-App-Debug
        path: app-child/build/outputs/apk/debug/app-child-debug.apk
